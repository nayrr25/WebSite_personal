<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#07090C"/>
  <!-- N silhouette -->
  <line x1="18" y1="14" x2="18" y2="50" stroke="#F5F7FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="14" x2="46" y2="50" stroke="#F5F7FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="14" x2="46" y2="50" stroke="#F5F7FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Connector -->
  <line x1="18" y1="50" x2="46" y2="14" stroke="#5EE9F0" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.55"/>
  <!-- Glowing nodes -->
  <circle cx="18" cy="14" r="4" fill="#5EE9F0"/>
  <circle cx="46" cy="14" r="3.5" fill="#7CF5C4"/>
  <circle cx="18" cy="50" r="3.5" fill="#7CF5C4"/>
  <circle cx="46" cy="50" r="4" fill="#5EE9F0"/>
  <!-- Center pulse -->
  <circle cx="32" cy="32" r="2" fill="#7CF5C4"/>
</svg>
